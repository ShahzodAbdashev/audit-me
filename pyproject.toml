[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audit-logging"
version = "0.1.0.dev0"
description = "One JSONL audit document per API request, captured at the ASGI layer."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
]

[project.optional-dependencies]
# Peer, not a hard dependency: the host application already brings it.
starlette = ["starlette>=0.37"]
prometheus = ["prometheus-client>=0.20"]
fast = ["orjson>=3.9"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-benchmark>=4",
    "httpx>=0.27",
    "hypothesis>=6",
    "mypy>=1.10",
    "fastapi>=0.110",
]

[tool.setuptools.packages.find]
include = ["audit_logging*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: needs the docker-compose Elasticsearch + Filebeat stack",
    "load: long-running load test, not part of the default run",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["audit_logging"]
warn_unreachable = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = ["orjson", "prometheus_client.*"]
ignore_missing_imports = true
