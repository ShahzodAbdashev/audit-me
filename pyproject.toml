[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# `audit-logging` is taken on PyPI; this matches the repository name.
name = "audit-me"
version = "0.1.0"
description = "Per-request API audit logging for FastAPI, with redaction, straight to Elasticsearch."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Abdashev Shahzod" }]
keywords = ["audit", "logging", "fastapi", "asgi", "elasticsearch", "compliance", "redaction"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
]

[project.urls]
Homepage = "https://github.com/ShahzodAbdashev/audit-me"
Issues = "https://github.com/ShahzodAbdashev/audit-me/issues"

[project.optional-dependencies]
# Ship to Elasticsearch from inside the app, with no Filebeat.
elasticsearch = ["httpx>=0.27"]
# Peer, not a hard dependency: the host application already brings it.
starlette = ["starlette>=0.37"]
prometheus = ["prometheus-client>=0.20"]
fast = ["orjson>=3.9"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-benchmark>=4",
    "httpx>=0.27",
    "hypothesis>=6",
    "mypy>=1.10",
    "fastapi>=0.110",
]

[tool.setuptools.packages.find]
include = ["audit_logging*"]

[tool.setuptools.package-data]
audit_logging = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: needs the docker-compose Elasticsearch + Filebeat stack",
    "load: long-running load test, not part of the default run",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["audit_logging"]
warn_unreachable = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = ["orjson", "prometheus_client.*"]
ignore_missing_imports = true
