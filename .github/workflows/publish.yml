# Publish audit-me to PyPI using a Trusted Publisher (OIDC) — no API token.
#
# PyPI's "pending publisher" form must be filled in to match this file exactly:
#
#   PyPI Project Name : audit-me
#   Owner             : ShahzodAbdashev
#   Repository name   : audit-me
#   Workflow name     : publish.yml        <- this file's name, not its `name:`
#   Environment name  : pypi               <- must match `environment:` below
#
# Any mismatch and PyPI rejects the upload with "not a trusted publisher",
# which is deliberately unhelpful about *which* field was wrong.
#
# To release:
#   git tag v0.1.0 && git push origin v0.1.0
#   then publish a GitHub Release for that tag
#
# The build runs on the tag; the upload waits for the GitHub Environment, so a
# release cannot be published by a push alone if you add a required reviewer.

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:        # manual run, for a dry run to TestPyPI

permissions:
  contents: read

jobs:
  test:
    # Do not publish something that does not pass. A yanked release is far more
    # annoying than a failed build.
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[elasticsearch,prometheus,fast]"
          pip install pytest pytest-asyncio pytest-benchmark httpx hypothesis mypy fastapi
      - name: Tests
        run: pytest tests -m "not load and not integration" -q
      - name: Types
        run: mypy --strict audit_logging

  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check metadata
        run: |
          pip install twine
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Must match the "Environment name" in PyPI's trusted publisher form.
    environment:
      name: pypi
      url: https://pypi.org/p/audit-me
    permissions:
      # This is what mints the OIDC token. Without it the upload fails with an
      # authentication error rather than a permissions one.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        # No `password:` — the OIDC token is exchanged automatically.
